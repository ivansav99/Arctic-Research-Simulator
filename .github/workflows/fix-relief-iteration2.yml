name: Fix glacier and 3D relief iteration 2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_relief_iteration2.py'
      - '.github/workflows/fix-relief-iteration2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply relief corrections
        run: python .github/scripts/fix_relief_iteration2.py
      - name: Validate JavaScript
        run: |
          node --check glacier-overlay-v2.js
          node --check relief-3d.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glacier-overlay-v2.js relief-3d.js index.html
          git commit -m "Restore glacier relief and anchor 3D view to vessel"
          git push
