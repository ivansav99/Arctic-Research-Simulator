name: Archive 3D and restore 2D presentation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/archive_3d_restore_2d.py'
      - '.github/workflows/archive-3d-restore-2d.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 2D restore
        run: python .github/scripts/archive_3d_restore_2d.py
      - name: Validate JavaScript
        run: |
          node --check game.js
          node --check glacier-overlay-v2.js
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js glacier-overlay-v2.js index.html archive/ relief-3d.js relief-3d.css
          git commit -m "Archive 3D mode and restore textured 2D map"
          git push
