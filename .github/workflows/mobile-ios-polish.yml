name: Mobile HUD and iOS Test App

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ios-polish.yml'

permissions:
  contents: write

actions:
  read: read

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply mobile and iOS changes
        run: python tools/mobile_ios_polish.py
      - name: Validate web changes and iOS project files
        run: |
          set -euo pipefail
          node --check game.js
          grep -q 'apple-mobile-web-app-capable' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'Expedition 22k: compact phone HUD' style.css
          grep -q 'mapPinchStep' game.js
          grep -q 'time-controls { display:none !important; }' style.css
          grep -q 'https://ivansav99.github.io/Arctic-Research-Simulator/?app=ios' ios/ArcticResearch/ArcticResearch/ContentView.swift
          grep -q 'PBXNativeTarget' ios/ArcticResearch/ArcticResearch.xcodeproj/project.pbxproj
          python - <<'PY'
          import json
          json.load(open('manifest.webmanifest'))
          json.load(open('ios/ArcticResearch/ArcticResearch/Assets.xcassets/Contents.json'))
          json.load(open('ios/ArcticResearch/ArcticResearch/Assets.xcassets/AppIcon.appiconset/Contents.json'))
          print('json validation ok')
          PY
      - name: Package iOS test project
        run: |
          cd ios
          zip -qr ../ArcticResearch-iOS-TestApp.zip ArcticResearch
          cd ..
      - name: Upload iOS test project artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcticResearch-iOS-TestApp
          path: ArcticResearch-iOS-TestApp.zip
          if-no-files-found: error
      - name: Publish game and iOS source
        run: |
          set -euo pipefail
          rm -f tools/mobile_ios_polish.py .github/workflows/mobile-ios-polish.yml ArcticResearch-iOS-TestApp.zip
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add index.html style.css game.js manifest.webmanifest ios/ArcticResearch tools/mobile_ios_polish.py .github/workflows/mobile-ios-polish.yml
          git commit -m 'Compact mobile HUD and add iOS test shell'
          git push origin HEAD:main
