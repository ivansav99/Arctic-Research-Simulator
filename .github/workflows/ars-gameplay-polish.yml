name: ARS gameplay polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-gameplay-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct guarded matcher
        run: python tools/fix_gameplay_polish_script.py

      - name: Apply gameplay polish
        run: python tools/ars_gameplay_polish.py

      - name: Validate scripts
        run: |
          set -euo pipefail
          node --check expedition.js
          node --check game.js
          grep -q "short:'Grad Student'" expedition.js
          grep -q "lastPublicationRejected" expedition.js
          grep -q "Minimum expedition team" expedition.js
          grep -q "NAVIGATE TO OPPORTUNITY" expedition.js
          grep -q "marketPrice:120000" expedition.js
          grep -q "emergencyRelocationAllowed" expedition.js
          grep -q "researchGuidanceHit" game.js
          grep -q "SVALBARD REINDEER" game.js
          grep -q "Oh, no! Your expedition failed" game.js
          grep -q "expedition-22g-gameplay" index.html

      - name: Publish gameplay polish
        run: |
          set -euo pipefail
          rm -f tools/ars_gameplay_polish.py tools/fix_gameplay_polish_script.py .github/workflows/ars-gameplay-polish.yml
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add expedition.js game.js index.html tools/ars_gameplay_polish.py tools/fix_gameplay_polish_script.py .github/workflows/ars-gameplay-polish.yml
          git commit -m 'Polish progression navigation wildlife and audio'
          git push origin HEAD:main
