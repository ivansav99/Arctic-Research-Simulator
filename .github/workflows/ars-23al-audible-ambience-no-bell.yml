name: ARS 23al audible ambience no bell

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23al-audible-ambience-no-bell.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Patch audible ambience and remove bell
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(s, old, new, label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          p=Path('game.js'); s=p.read_text()
          s=repl(s,
            "nextBird=0,nextBell=0,nextAnimal=0;",
            "nextBird=0,nextAnimal=0;",
            'remove bell timer state')
          s=repl(s,
            "padFilter.frequency.value=360;ambientPadGain=c.createGain();ambientPadGain.gain.value=.0001;padFilter.connect(ambientPadGain).connect(c.destination);for(const freq of[82.4,123.6]){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=freq<100?.7:.38;",
            "padFilter.frequency.value=720;ambientPadGain=c.createGain();ambientPadGain.gain.value=.0001;padFilter.connect(ambientPadGain).connect(c.destination);for(const freq of[196,293.7]){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=freq<250?.55:.24;",
            'phone audible pad frequencies')
          s=repl(s,
            "if(!nextBird)nextBird=now+9000+Math.random()*8000;if(!nextBell)nextBell=now+18000+Math.random()*14000;if(season==='summer'&&now>=nextBird)",
            "if(!nextBird)nextBird=now+9000+Math.random()*8000;if(season==='summer'&&now>=nextBird)",
            'remove bell scheduling')
          old="if(now>=nextBell){const base={autumn:196,winter:146.8,spring:220,summer:246.9}[season];tone(base,1.7,.0045,0,'sine');tone(base*1.5,1.3,.003,.24,'sine');nextBell=now+26000+Math.random()*26000;}"
          s=repl(s,old,'','remove bell playback')
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          old='expedition-23ak-adaptive-wildlife-audio'
          if old not in s: raise SystemExit('cache token not found')
          p.write_text(s.replace(old,'expedition-23al-audible-ambience-no-bell',1))
          PY
      - name: Validate
        run: |
          node --check game.js
          grep -Fq "for(const freq of[196,293.7])" game.js
          grep -Fq "padFilter.frequency.value=720" game.js
          ! grep -Fq "nextBell" game.js
          ! grep -Fq "tone(base,1.7" game.js
          grep -Fq "['whale','seal','walrus','bird'].includes(type)" game.js
          grep -Fq "expedition-23al-audible-ambience-no-bell" index.html
      - name: Commit
        run: |
          git add game.js index.html
          git commit -m "Make Arctic ambience audible and remove bell tones"
          git push origin HEAD:main
