name: Tune 3D relief performance

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/relief3d_perf.py'
      - '.github/workflows/relief3d-perf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply performance patch
        run: python .github/scripts/relief3d_perf.py
      - name: Validate JavaScript
        run: |
          node --check game.js
          node --check relief-3d.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js relief-3d.js
          git commit -m "Reduce 3D relief rendering cost"
          git push
