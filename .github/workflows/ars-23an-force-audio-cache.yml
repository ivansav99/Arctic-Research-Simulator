name: ARS 23an force audio cache refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23an-force-audio-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Force fresh game audio JavaScript URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('expedition.js?v=expedition-23ak-adaptive-wildlife-audio','expedition.js?v=expedition-23an-force-audio-cache')
          s=s.replace('game.js?v=expedition-23ak-adaptive-wildlife-audio','game.js?v=expedition-23an-force-audio-cache')
          s=s.replace('style.css?v=expedition-23am-clean-animal-audio','style.css?v=expedition-23an-force-audio-cache')
          if 'game.js?v=expedition-23an-force-audio-cache' not in s: raise SystemExit('game cache bust failed')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -Fq "game.js?v=expedition-23an-force-audio-cache" index.html
          grep -Fq "expedition.js?v=expedition-23an-force-audio-cache" index.html
          node --check game.js
      - name: Commit
        run: |
          git add index.html
          git commit -m "Force fresh audio JavaScript on mobile"
          git push origin HEAD:main
