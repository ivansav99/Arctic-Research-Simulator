name: ARS 23aa equipment-aware grants

# trigger 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23aa-equipment-grants.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply equipment-aware grant patch
        run: python .github/ars-23aa-equipment-grants.py
      - name: Validate JavaScript syntax
        run: |
          node --check expedition.js
          node --check game.js
      - name: Validate grant behavior markers
        run: |
          grep -q "FALLBACK_PROJECTS" expedition.js
          grep -q "fallbackEquipmentPlan" expedition.js
          grep -q "operationalGear" expedition.js
          grep -q "grants-v8-equipment" expedition.js
          grep -q "expedition-23aa-equipment-grants" index.html
          grep -q "Atlantification Zooplankton Transport Experiment" expedition.js
          grep -q "Polar Boundary-Layer Aerosol–Cloud Coupling Experiment" expedition.js
      - name: Commit validated grant improvements
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
          git add expedition.js index.html
          git commit -m "Make ARS grants use science equipment"
          git push origin main
      - name: Remove temporary patch machinery
        if: success()
        run: |
          rm -f .github/ars-23aa-equipment-grants.py .github/workflows/ars-23aa-equipment-grants.yml
          git add -A
          git commit -m "Remove ARS 23aa patch runner"
          git push origin main
