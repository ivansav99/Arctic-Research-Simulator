name: Apply Expedition 17 wildlife label fix

on:
  push:
    branches: [main]
    paths:
      - 'patches/expedition17-labels.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove wildlife map labels and bump cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          g=Path('game.js')
          s=g.read_text()
          assert "const GAME_VERSION='expedition-16'" in s
          assert 'drawWildlifeLabels();' in s
          s=s.replace("const GAME_VERSION='expedition-16'", "const GAME_VERSION='expedition-17'", 1)
          s=s.replace('drawWildlifeLabels();', '/* wildlife labels intentionally hidden; species is revealed on interaction */', 1)
          g.write_text(s)

          i=Path('index.html')
          h=i.read_text()
          assert 'expedition-16' in h
          h=h.replace('expedition-16','expedition-17')
          i.write_text(h)
          PY
          node --check game.js
          git rm patches/expedition17-labels.trigger .github/workflows/apply-expedition17-labels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html
          git commit -m "Hide wildlife labels on map"
          git push
