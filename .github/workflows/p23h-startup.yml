name: Expedition 23h startup hardening
on:
  push:
    paths:
      - '.github/workflows/p23h-startup.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply startup patch
        run: python3 .github/scripts/p23h_startup.py
      - name: Validate JavaScript and patch
        run: |
          node --check game.js
          node --check expedition.js
          git diff --check
          grep -q "beginFreshNewGame" game.js
          grep -q "expedition-23h-startup" index.html
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m "Harden new game startup and bust runtime cache"
          git push
