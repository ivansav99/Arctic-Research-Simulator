name: ARS 23z opportunity hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23z-opportunity-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply opportunity hotfix
        run: python .github/ars-23z-opportunity-hotfix.py
      - name: Validate JavaScript syntax
        run: |
          node --check expedition.js
          node --check game.js
      - name: Validate opportunity rules
        run: |
          grep -q "careerFallbackTemplates" expedition.js
          grep -q "grants-v7-" expedition.js
          grep -q "cooldown=3" expedition.js
          grep -q "fieldBuffer=45,grantBuffer=80" game.js
          grep -q "expedition-23z-opportunity-hotfix" index.html
          ! grep -q "payload.ice==='fast'" expedition.js
          ! grep -q "nextProfile.type!=='fast'" game.js
      - name: Commit validated hotfix
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
          git add expedition.js game.js index.html
          git commit -m "Restore ARS grant and underway opportunities"
          git push origin main
      - name: Remove temporary patch machinery
        if: success()
        run: |
          rm -f .github/ars-23z-opportunity-hotfix.py .github/workflows/ars-23z-opportunity-hotfix.yml
          git add -A
          git commit -m "Remove ARS 23z patch runner"
          git push origin main
