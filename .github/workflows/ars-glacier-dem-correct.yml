name: ARS glacier DEM correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-glacier-dem-correct.yml'

permissions:
  contents: write

jobs:
  correct-dem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recover builder and require actual DEM raster
        run: |
          set -euo pipefail
          git show 7b65d68584cf0e99818b772e367f382491b8587d:tools/build_glacier_surface.py > /tmp/build_glacier_surface.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/build_glacier_surface.py')
          s=p.read_text()
          old='''    for p in out.rglob("*.tif"):\n        n = p.name.lower()\n        if any(skip in n for skip in ("count", "mad", "datamask", "hillshade", "browse")):\n            continue\n        tifs.append(p)'''
          new='''    for p in out.rglob("*.tif"):\n        n = p.name.lower()\n        if not n.endswith("_dem.tif"):\n            continue\n        if any(skip in n for skip in ("count", "mad", "datamask", "hillshade", "browse", "mindate", "maxdate")):\n            continue\n        tifs.append(p)'''
          if old not in s: raise SystemExit('DEM filter anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          python -m pip install --quiet numpy pillow pyshp pyproj shapely rasterio

      - name: Download glacier and ArcticDEM data
        run: |
          set -euo pipefail
          mkdir -p /tmp/ars-glacier-data
          curl --fail --location --retry 3 --output /tmp/ars-glacier-data/ne_glaciers.zip \
            https://naciscdn.org/naturalearth/10m/physical/ne_10m_glaciated_areas.zip
          curl --fail --location --retry 3 --output /tmp/ars-glacier-data/arcticdem_1km.tar.gz \
            https://data.pgc.umn.edu/elev/dem/setsm/ArcticDEM/mosaic/latest/1km/arcticdem_mosaic_1km_v4.1.tar.gz

      - name: Rebuild data assets only
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('builder','/tmp/build_glacier_surface.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          tifs=m.find_dem_tifs(Path('/tmp/ars-glacier-data/arcticdem_1km.tar.gz'))
          assert len(tifs)==1 and tifs[0].name.lower().endswith('_dem.tif'), [str(p) for p in tifs]
          m.make_assets(Path('/tmp/ars-glacier-data/ne_glaciers.zip'),Path('/tmp/ars-glacier-data/arcticdem_1km.tar.gz'),Path('.').resolve())
          p=Path('glacier-data.js'); s=p.read_text(); s=s.replace('assets/data/arctic-surface-elevation.png','assets/data/arctic-surface-elevation.png?v=dem41a').replace('assets/data/arctic-glacier-relief.png','assets/data/arctic-glacier-relief.png?v=dem41a'); p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text().replace('expedition-22p-glaciers','expedition-22q-glaciers'); p.write_text(s)
          p=Path('game.js'); s=p.read_text().replace("const GAME_VERSION='expedition-22p-glaciers'","const GAME_VERSION='expedition-22q-glaciers'"); p.write_text(s)
          PY
          ls -lh glacier-data.js assets/data/arctic-surface-elevation.png assets/data/arctic-glacier-relief.png

      - name: Validate corrected build
        run: |
          set -euo pipefail
          node --check glacier-data.js
          node --check game.js
          grep -q 'expedition-22q-glaciers' index.html
          grep -q 'dem41a' glacier-data.js
          grep -q 'function glacierAt' game.js
          test $(wc -c < assets/data/arctic-surface-elevation.png) -gt 10000
          test $(wc -c < assets/data/arctic-glacier-relief.png) -gt 10000

      - name: Publish corrected DEM assets
        run: |
          set -euo pipefail
          rm -f .github/workflows/ars-glacier-dem-correct.yml
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add index.html game.js glacier-data.js assets/data/arctic-surface-elevation.png assets/data/arctic-glacier-relief.png .github/workflows/ars-glacier-dem-correct.yml
          git commit -m 'Correct ArcticDEM glacier surface source'
          git push origin HEAD:main
