name: Expedition 23m research program redesign
on:
  push:
    paths:
      - '.github/workflows/p23m-research-redesign.yml'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose patch
        run: |
          set +e
          python3 .github/scripts/p23m_research_redesign.py > /tmp/p23m.log 2>&1
          status=$?
          echo "exit=$status" >> /tmp/p23m.log
          cat /tmp/p23m.log
          cp /tmp/p23m.log p23m-diagnostic.txt
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p23m-diagnostic.txt
          git commit -m "Record research redesign diagnostic"
          git push
