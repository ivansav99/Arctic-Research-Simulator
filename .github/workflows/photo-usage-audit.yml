name: Photo usage audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/photo-usage-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/photo_usage_audit.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add photo-usage-audit.json
          git commit -m "Write photo usage audit" || exit 0
          git push
