name: ARS 23ak adaptive economy wildlife audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23ak-adaptive-economy-animal-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Patch ambience wildlife and adaptive publication economy
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(s,old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          # ---------- game.js ----------
          p=Path('game.js'); s=p.read_text()
          s=replace_once(s,
            "let ac=null,waveSource=null,waveGain=null,ambientWindGain=null,ambientPadGain=null,ambientPadOsc=[],lastCrack=0,lastAnimal=0,unlockChimed=false,unlockPromise=null,nextBird=0,nextBell=0;",
            "let ac=null,waveSource=null,waveGain=null,ambientWindGain=null,ambientPadGain=null,ambientPadOsc=[],lastCrack=0,lastAnimal=0,unlockChimed=false,unlockPromise=null,nextBird=0,nextBell=0,nextAnimal=0;",
            'animal ambience timer')
          s=replace_once(s,
            "{autumn:.0060,winter:.0043,spring:.0068,summer:.0058}",
            "{autumn:.0120,winter:.0086,spring:.0136,summer:.0116}",
            'double ambient volume')
          s=replace_once(s,
            "case'seal':burst(.16,.035,500,1700);tone(330,.16,.025,.04,'square');break;case'mammal':tone(520,.12,.025,0,'square');tone(390,.15,.02,.13,'square');break;case'fish':tone(1150,.025,.012);tone(900,.025,.01,.05);break;",
            "case'seal':burst(.16,.035,500,1700);tone(330,.16,.025,.04,'square');break;case'walrus':burst(.28,.026,110,620);tone(148,.34,.030,.02,'triangle');tone(118,.24,.020,.23,'sine');break;case'mammal':tone(520,.12,.025,0,'square');tone(390,.15,.02,.13,'square');break;case'fish':tone(1150,.025,.012);tone(900,.025,.01,.05);break;",
            'walrus sound')
          old="if(now>=nextBell){const base={autumn:196,winter:146.8,spring:220,summer:246.9}[season];tone(base,1.7,.0045,0,'sine');tone(base*1.5,1.3,.003,.24,'sine');nextBell=now+26000+Math.random()*26000;}"
          new="if(now>=nextBell){const base={autumn:196,winter:146.8,spring:220,summer:246.9}[season];tone(base,1.7,.0045,0,'sine');tone(base*1.5,1.3,.003,.24,'sine');nextBell=now+26000+Math.random()*26000;}if(!nextAnimal)nextAnimal=now+22000+Math.random()*26000;if(now>=nextAnimal){const animal=nearbyAnimal(),type=animal==='walrus'?'walrus':animal;if(['whale','seal','walrus','bird'].includes(type)){play(type);lastAnimal=now;nextAnimal=now+30000+Math.random()*45000;}else nextAnimal=now+12000+Math.random()*10000;}"
          s=replace_once(s,old,new,'nearby animal ambience')
          p.write_text(s)

          # ---------- expedition.js ----------
          p=Path('expedition.js'); s=p.read_text()
          s=replace_once(s,
            "economyDays:0, elapsedDays:0, log:['Expedition commissioned in Longyearbyen.'], navigation:null, lastTargetContext:null,",
            "economyDays:0, elapsedDays:0, publicationRewardMultiplier:1, netWorthBaseline:null, netWorthBaselineDay:0, netWorthHistory:[], log:['Expedition commissioned in Longyearbyen.'], navigation:null, lastTargetContext:null,",
            'adaptive state fields')

          helper="""  function programNetWorth() {\n    const vesselAssets=(state.ownedVessels||[]).reduce((sum,id)=>{const ship=VESSELS[id];return sum+(ship?(Number(ship.marketPrice??ship.price)||0):0);},0);\n    const durableAssets=(state.installedEquipment||[]).reduce((sum,id)=>{const item=EQUIPMENT[id];return sum+(item&&!item.consumable&&!item.builtIn?(Number(item.price)||0):0);},0);\n    const consumableAssets=Object.entries(state.inventory||{}).reduce((sum,[id,count])=>{const item=EQUIPMENT[id];if(!item?.consumable)return sum;const unitValue=(Number(item.price)||0)/Math.max(1,Number(item.units)||1);return sum+Math.max(0,Number(count)||0)*unitValue;},0);\n    return Math.max(1,Math.round((Number(state.money)||0)+vesselAssets+durableAssets+consumableAssets));\n  }\n  function adaptivePublicationMultiplier(){return clamp(Number(state.publicationRewardMultiplier)||1,.5,2);}\n  function adaptivePublicationAward(baseAward){return Math.max(0,Math.round((Number(baseAward)||0)*adaptivePublicationMultiplier()));}\n  function updatePublicationEconomy() {\n    const worth=programNetWorth();\n    if(!Number.isFinite(state.netWorthBaseline)||state.netWorthBaseline<=0){state.netWorthBaseline=worth;state.netWorthBaselineDay=state.elapsedDays;state.netWorthHistory=[{day:state.elapsedDays,netWorth:worth,multiplier:adaptivePublicationMultiplier()}];return;}\n    const period=Math.max(0,state.elapsedDays-(Number(state.netWorthBaselineDay)||0));if(period<30)return;\n    const ratio=Math.max(.01,worth/Math.max(1,state.netWorthBaseline)),monthlyGrowth=Math.pow(ratio,30/period)-1;\n    const desired=clamp(1.25-5*monthlyGrowth,.5,2),current=adaptivePublicationMultiplier(),step=clamp(desired-current,-.20,.20),next=clamp(current+step,.5,2);\n    state.publicationRewardMultiplier=Math.round(next*100)/100;state.netWorthHistory=[...(state.netWorthHistory||[]),{day:state.elapsedDays,netWorth:worth,monthlyGrowth:Math.round(monthlyGrowth*10000)/10000,multiplier:state.publicationRewardMultiplier}].slice(-12);state.netWorthBaseline=worth;state.netWorthBaselineDay=state.elapsedDays;\n    addLog(`Publication funding index reviewed: ${Math.round(monthlyGrowth*100)}% monthly-equivalent net-worth growth · paper awards ${Math.round(state.publicationRewardMultiplier*100)}% of standard.`);\n  }\n\n"""
          marker="  function publishPaper(automatic=false) {"
          if s.count(marker)!=1: raise SystemExit('publishPaper marker mismatch')
          s=s.replace(marker,helper+marker,1)
          s=replace_once(s,
            "award=Math.round(level.award*factor); initialCitations=Math.max(1,Math.round(level.initialCitations*factor));",
            "award=Math.round(level.award*factor*adaptivePublicationMultiplier()); initialCitations=Math.max(1,Math.round(level.initialCitations*factor));",
            'adaptive normal paper award')
          s=replace_once(s,
            "const award=level.award,initialCitations=level.initialCitations,potential=level.potential,title=`Article: ${group} of the Arctic`;",
            "const award=adaptivePublicationAward(level.award),initialCitations=level.initialCitations,potential=level.potential,title=`Article: ${group} of the Arctic`;",
            'adaptive wildlife paper award')
          s=replace_once(s,
            "state.elapsedDays=(Number(state.elapsedDays)||0)+days;\n    state.recentGrantSites=",
            "state.elapsedDays=(Number(state.elapsedDays)||0)+days;\n    updatePublicationEconomy();\n    state.recentGrantSites=",
            'monthly economy update')
          old="state.lastProfessorGrantDay=Number(state.lastProfessorGrantDay??-999); state.lastExpiredGrantRemovalDay=Number(state.lastExpiredGrantRemovalDay??-999); state.remoteOffer=state.remoteOffer||null; state.helicopterFoodReminderShown=!!state.helicopterFoodReminderShown; state.elapsedDays=Number(state.elapsedDays)||0; state.playerConfigured=!!state.playerConfigured;"
          new="state.lastProfessorGrantDay=Number(state.lastProfessorGrantDay??-999); state.lastExpiredGrantRemovalDay=Number(state.lastExpiredGrantRemovalDay??-999); state.remoteOffer=state.remoteOffer||null; state.helicopterFoodReminderShown=!!state.helicopterFoodReminderShown; state.elapsedDays=Number(state.elapsedDays)||0; state.publicationRewardMultiplier=clamp(Number(state.publicationRewardMultiplier)||1,.5,2); state.netWorthBaseline=Number(state.netWorthBaseline)||null; state.netWorthBaselineDay=Number(state.netWorthBaselineDay)||state.elapsedDays; state.netWorthHistory=Array.isArray(state.netWorthHistory)?state.netWorthHistory.slice(-12):[]; state.playerConfigured=!!state.playerConfigured;"
          s=replace_once(s,old,new,'load adaptive defaults')
          p.write_text(s)

          # ---------- cache bust ----------
          p=Path('index.html'); s=p.read_text()
          old='expedition-23aj-ambience-distance-only'
          if old not in s: raise SystemExit('cache token not found')
          p.write_text(s.replace(old,'expedition-23ak-adaptive-wildlife-audio'))
          PY
      - name: Validate
        run: |
          node --check expedition.js
          node --check game.js
          grep -Fq "{autumn:.0120,winter:.0086,spring:.0136,summer:.0116}" game.js
          grep -Fq "['whale','seal','walrus','bird'].includes(type)" game.js
          grep -Fq "function programNetWorth" expedition.js
          grep -Fq "function updatePublicationEconomy" expedition.js
          grep -Fq "publicationRewardMultiplier:1" expedition.js
          grep -Fq "factor*adaptivePublicationMultiplier()" expedition.js
          grep -Fq "adaptivePublicationAward(level.award)" expedition.js
          grep -Fq "clamp(desired-current,-.20,.20)" expedition.js
          grep -Fq "expedition-23ak-adaptive-wildlife-audio" index.html
      - name: Commit
        run: |
          git add game.js expedition.js index.html
          git commit -m "Add wildlife ambience and adaptive publication rewards"
          git push origin HEAD:main
