name: Expedition 23m research redesign retry 2
on:
  push:
    paths:
      - '.github/workflows/p23m-retry2.yml'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate with diagnostics
        run: |
          set +e
          python3 - <<'PY' > p23m-retry2-diagnostic.txt 2>&1
          from pathlib import Path
          p=Path('.github/scripts/p23m_research_redesign.py')
          s=p.read_text()
          old='exp=once(exp,"reward:target.reward,equipment:[...target.equipment]","reward:target.reward,upfront:target.upfront||0,advancePaid:target.advancePaid||0,equipment:[...target.equipment]",\'deployment advance copy\')'
          new='needle="reward:target.reward,equipment:[...target.equipment]"\nreplacement="reward:target.reward,upfront:target.upfront||0,advancePaid:target.advancePaid||0,equipment:[...target.equipment]"\nif exp.count(needle)!=2: raise SystemExit(f"deployment advance copy: expected two matches, got {exp.count(needle)}")\nexp=exp.replace(needle,replacement)'
          print('deployment line found', old in s)
          if old not in s: raise SystemExit('deployment patch line not found')
          s=s.replace(old,new,1)
          start=s.index('# Team return visits can be dropped; mooring/equipment recovery remains protected.')
          end=s.index('# Navigation prompt is now just the stable research card.',start)
          print('removing fragile pickup patch section',end-start)
          s=s[:start]+s[end:]
          p.write_text(s)
          PY
          prep=$?
          echo "prep=$prep" >> p23m-retry2-diagnostic.txt
          if [ "$prep" -eq 0 ]; then
            python3 .github/scripts/p23m_research_redesign.py >> p23m-retry2-diagnostic.txt 2>&1
            patch=$?
          else patch=99; fi
          echo "main_patch=$patch" >> p23m-retry2-diagnostic.txt
          if [ "$patch" -eq 0 ]; then
            python3 - <<'PY' >> p23m-retry2-diagnostic.txt 2>&1
          from pathlib import Path
          import re
          p=Path('expedition.js');s=p.read_text()
          replacement="""  function abandonDeployment(id){
            const deployment=state.deployments.find(item=>item.id===id);if(!deployment||deployment.recoveryMode!=='staged-recovery')return;
            deployment.status='abandoned';if(deployment.recoveryTargetId)state.targets=state.targets.filter(item=>item.id!==deployment.recoveryTargetId);deployment.recoveryTargetId=null;
            addLog(`Return pickup dropped for ${deployment.title}; local logistics assumed responsibility for the field party.`);toast('RETURN PICKUP DROPPED · LOCAL LOGISTICS WILL RECOVER THE TEAM');changed();
          }
          function dropGrant(id) {
            const grant=state.targets.find(item=>item.id===id&&(item.kind==='grant'||item.kind==='contract'));if(!grant||activeOperation?.targetId===id)return;
            if(grant.deploymentId&&grant.missionMode!=='staged-recovery'){toast('THIS RETURN VISIT IS REQUIRED TO RECOVER DEPLOYED EQUIPMENT');return;}
            if(grant.deploymentId&&grant.missionMode==='staged-recovery'){
              const deployment=state.deployments.find(item=>item.id===grant.deploymentId);if(deployment){deployment.status='abandoned';deployment.recoveryTargetId=null;}
              addLog(`Return pickup dropped for ${grant.title}; local logistics assumed responsibility for the field party.`);
            }else state.droppedGrantTemplates.push(grant.templateId);
            state.targets=state.targets.filter(item=>item.id!==id);if(state.navigation?.id===id)state.navigation=null;if(state.lastTargetContext?.id===id)state.lastTargetContext=null;
            root?.querySelector('#arx-target-modal')?.classList.remove('open');toast(grant.missionMode==='staged-recovery'?'RETURN PICKUP DROPPED':'RESEARCH GRANT DROPPED');changed();
          }

          function vesselOverlay()"""
          pattern=r"  function dropGrant\(id\) \{.*?\n  \}\s*\n  function vesselOverlay\(\)"
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          print('dropGrant regex matches',n)
          if n!=1: raise SystemExit(f'dropGrant regex patch expected 1, got {n}')
          p.write_text(s)
          PY
            pickup=$?
          else pickup=99; fi
          echo "pickup_patch=$pickup" >> p23m-retry2-diagnostic.txt
          if [ "$patch" -eq 0 ] && [ "$pickup" -eq 0 ]; then
            node --check expedition.js >> p23m-retry2-diagnostic.txt 2>&1; s1=$?
            node --check game.js >> p23m-retry2-diagnostic.txt 2>&1; s2=$?
            git diff --check >> p23m-retry2-diagnostic.txt 2>&1; s3=$?
            grep -q "Long-Range Fixed-Wing Survey UAS" expedition.js; s4=$?
            grep -q "PAID UPFRONT ON ACCEPTANCE" expedition.js; s5=$?
            grep -q "renderResearchWindow" expedition.js; s6=$?
            grep -q "postdoc-frontogenesis" expedition.js; s7=$?
            grep -q "researchGuidanceHit=hits" game.js; s8=$?
            grep -q "expedition-23m-research-program" index.html; s9=$?
            grep -q "function abandonDeployment" expedition.js; s10=$?
            echo "validation=$s1,$s2,$s3,$s4,$s5,$s6,$s7,$s8,$s9,$s10" >> p23m-retry2-diagnostic.txt
            if [ "$s1$s2$s3$s4$s5$s6$s7$s8$s9$s10" = "0000000000" ]; then touch p23m-retry2-success; fi
          fi
          cat p23m-retry2-diagnostic.txt
      - name: Commit result or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f p23m-retry2-success ]; then
            git add expedition.js game.js index.html p23m-retry2-diagnostic.txt
            git commit -m "Redesign grants and field research workflow"
          else
            git add p23m-retry2-diagnostic.txt
            git commit -m "Record research redesign retry 2 diagnostic"
          fi
          git push
