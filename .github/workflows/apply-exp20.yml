name: Apply Expedition 20
on:
  push:
    paths:
      - '.stage/exp20-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .stage/exp20-b64-00 .stage/exp20-b64-01 .stage/exp20-b64-02 .stage/exp20-b64-03 .stage/exp20-b64-04 | base64 -d | gzip -d > /tmp/exp20.patch
          echo '1211a4bb4414031f99ad9c58eeb5ca80cb575fe2d71fe078ad3674b7a0fd2f9e  /tmp/exp20.patch' | sha256sum -c -
          echo '0e690e6305c000cbd290095a86e808bcc25fc6d0c5f9ef45ae4cdfcb5f78d4c6  game.js' | sha256sum -c -
          echo '16958ec621a5171fa4367f93895852925fe28f0745664f7cd19eb22d49dd682c  expedition.js' | sha256sum -c -
          echo '9a6866251753af0fa2df17a808b3a036a185708332dab3561dc95b8c005ea7e0  index.html' | sha256sum -c -
          git apply --check /tmp/exp20.patch
      - name: Apply and test Expedition 20
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/exp20.patch
          node --check game.js
          node --check expedition.js
          echo 'aa29749a5a9ca1835a5f626971cfcdcd77ada22114517db81a156ff8de9ff37e  game.js' | sha256sum -c -
          echo '1efc998e5ba6025144ae2fa8e2b415eab9159edde9e405ea1b182e8fbca8468c  expedition.js' | sha256sum -c -
          echo '812faa2421dbf26d68a2b5f8d93bf2cc007139f8327fe1eb5252295f540eb29d  index.html' | sha256sum -c -
      - name: Commit production update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .stage/exp20-b64-* .stage/exp20-trigger.txt .github/workflows/apply-exp20.yml
          rmdir .stage 2>/dev/null || true
          git config user.name 'ARS Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Balance Arctic night, fast ice, research, and professor grants'
          git push origin HEAD:main
