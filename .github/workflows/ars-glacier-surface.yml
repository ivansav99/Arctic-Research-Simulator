name: ARS glacier surface relief

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-glacier-surface.yml'

permissions:
  contents: write

jobs:
  build-glaciers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare geospatial builder
        run: |
          set -euo pipefail
          python tools/fix_glacier_builder_startup.py
          python -m pip install --quiet numpy pillow pyshp pyproj shapely rasterio

      - name: Download public glacier and surface data
        run: |
          set -euo pipefail
          mkdir -p /tmp/ars-glacier-data
          curl --fail --location --retry 3 --output /tmp/ars-glacier-data/ne_glaciers.zip \
            https://naciscdn.org/naturalearth/10m/physical/ne_10m_glaciated_areas.zip
          curl --fail --location --retry 3 --output /tmp/ars-glacier-data/arcticdem_1km.tar.gz \
            https://data.pgc.umn.edu/elev/dem/setsm/ArcticDEM/mosaic/latest/1km/arcticdem_mosaic_1km_v4.1.tar.gz
          ls -lh /tmp/ars-glacier-data

      - name: Build compact ARS glacier assets
        run: |
          set -euo pipefail
          python tools/build_glacier_surface.py \
            --natural-earth /tmp/ars-glacier-data/ne_glaciers.zip \
            --arcticdem /tmp/ars-glacier-data/arcticdem_1km.tar.gz \
            --repo .
          ls -lh glacier-data.js assets/data/arctic-surface-elevation.png assets/data/arctic-glacier-relief.png

      - name: Validate glacier gameplay integration
        run: |
          set -euo pipefail
          node --check glacier-data.js
          node --check game.js
          node --check expedition.js
          grep -q 'expedition-22p-glaciers' index.html
          grep -q 'glacier-data.js' index.html
          grep -q 'function glacierAt' game.js
          grep -q "return'glacier'" game.js
          grep -q "glacierAt(x,y)||(isLand" game.js
          grep -q 'drawPermanentGlaciers' game.js
          grep -q 'surfaceElevationNormAt' game.js
          grep -q 'ARCTICDEM SURFACE' game.js
          test $(wc -c < glacier-data.js) -gt 10000
          test $(wc -c < assets/data/arctic-glacier-relief.png) -gt 10000
          test $(wc -c < assets/data/arctic-surface-elevation.png) -gt 10000

      - name: Browser startup smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 8123 >/tmp/ars-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          set +e
          timeout 15s "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --host-resolver-rules='MAP * 127.0.0.1, EXCLUDE 127.0.0.1' \
            --enable-logging=stderr --v=0 --virtual-time-budget=3500 \
            --dump-dom http://127.0.0.1:8123/ >/tmp/ars-dom.html 2>/tmp/ars-chrome.log
          STATUS=$?
          set -e
          cat /tmp/ars-chrome.log
          if grep -Ei 'Uncaught|ReferenceError|TypeError|SyntaxError' /tmp/ars-chrome.log; then
            echo 'Browser JavaScript error detected'
            exit 1
          fi
          test "$STATUS" -eq 0 -o "$STATUS" -eq 124

      - name: Publish glacier surface model
        run: |
          set -euo pipefail
          rm -f tools/build_glacier_surface.py tools/fix_glacier_builder_startup.py .github/workflows/ars-glacier-surface.yml
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add index.html game.js glacier-data.js assets/data/arctic-surface-elevation.png assets/data/arctic-glacier-relief.png \
            tools/build_glacier_surface.py tools/fix_glacier_builder_startup.py .github/workflows/ars-glacier-surface.yml
          git commit -m 'Add permanent Arctic glacier relief and surface elevation'
          git push origin HEAD:main
