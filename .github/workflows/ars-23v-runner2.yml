name: ARS 23v corrected cleanup pass

on:
  push:
    branches: [main]
    paths:
      - '.github/ars-23v-patch2.py'
      - '.github/workflows/ars-23v-runner2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply corrected ARS 23v patch
        run: python .github/ars-23v-patch2.py
      - name: Validate JavaScript
        run: |
          node --check expedition.js
          node --check game.js
      - name: Validate requested changes
        run: |
          grep -F "promotion:{papers:0,citations:2000}" expedition.js
          grep -F "state.citations>=2000" expedition.js
          grep -F "templateCareerLevel(item)<=careerFloor" expedition.js
          grep -F "distanceWindow:window" expedition.js
          grep -F "function fastIceGrowth(){return 0;}" game.js
          grep -F "visibleWildlifeCount()>=1" game.js
          grep -F "assets/vessels/noaa-rv-brown.webp" expedition.js
          grep -F "Oden%20Hjorthfjellet.jpg" expedition.js
          grep -F "expedition-23v-grants-wildlife-no-fast-ice" index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expedition.js game.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restore grants remove fast ice and reduce wildlife"
          git push origin main
