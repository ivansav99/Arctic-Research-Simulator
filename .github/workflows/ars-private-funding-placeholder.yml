name: ARS private funding placeholder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-private-funding-placeholder.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/ars_private_funding_patch.py
      - name: Validate
        run: |
          node --check expedition.js
          grep -q "ars.private_funding.1m" expedition.js
          grep -q "APPLY FOR PRIVATE FUNDING" expedition.js
          grep -q "WEB PREVIEW · NO REAL CHARGE" expedition.js
          grep -q "window.ArcticResearchIAP" expedition.js
          grep -q "arx-funding-modal" expedition.js
          grep -q "expedition.js?v=expedition-22f-funding" index.html
      - name: Publish
        run: |
          rm -f .github/workflows/ars-private-funding-placeholder.yml .github/ars_private_funding_patch.py
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add expedition.js index.html .github/workflows/ars-private-funding-placeholder.yml .github/ars_private_funding_patch.py
          git commit -m 'Add private funding purchase placeholder'
          git push origin HEAD:main
