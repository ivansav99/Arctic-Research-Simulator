name: Expedition 23i map cache and gameplay polish
on:
  push:
    paths:
      - '.github/workflows/p23i-mapcache.yml'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and tune moving-map cache
        run: |
          python3 .github/scripts/p23i_mapcache.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="const refreshMs=IS_COARSE_POINTER?125:85,shiftLimit=IS_COARSE_POINTER?64:52;"
          new="const refreshMs=IS_COARSE_POINTER?260:150,shiftLimit=IS_COARSE_POINTER?120:82;"
          if old not in s: raise SystemExit('cache tuning marker missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate runtime
        run: |
          node --check game.js
          node --check expedition.js
          git diff --check
          grep -q "drawWorldCached(now)" game.js
          grep -q "IS_COARSE_POINTER?260:150" game.js
          grep -q "setLineDash(\[18,11\])" game.js
          grep -q "findPortTeleportPosition(currentPortCity)" game.js
          grep -q "observedWildlifeFallback.add(animal.individualId)" game.js
          grep -q "scheduleGrantRefresh(0)" expedition.js
          grep -q "Field identification pending" expedition.js
          grep -q "expedition-23i-mapcache" index.html
          ! grep -q "drawVesselTrack();drawWakeTrail()" game.js
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js expedition.js style.css index.html
          git diff --cached --quiet && { echo 'No runtime changes'; exit 1; }
          git commit -m "Cache moving map and restore gameplay feedback"
          git push
