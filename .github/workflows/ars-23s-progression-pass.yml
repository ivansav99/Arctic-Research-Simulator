name: ARS 23s progression and navigation pass
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23s-progression-pass.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply progression patch
        run: python3 .github/ars-23s-patch.py
      - name: Validate JavaScript and progression markers
        run: |
          node --check expedition.js
          node --check game.js
          grep -q 'CAREER_CITATION_COST' expedition.js
          grep -q 'FULL FUEL / FOOD / LAB STORES' expedition.js
          grep -q "refreshProgressionOpportunities('career-promotion')" expedition.js
          grep -q 'sameLevel.length\*2' expedition.js
          grep -q 'wildlifeObservationDataValue' game.js
          grep -q 'miniViewX' game.js
          grep -q '!currentPortCity&&researchOpportunityClock' game.js
          grep -q 'expedition-23s-progression-pass' index.html
      - name: Commit progression pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ars-23s-progression-pass.yml .github/ars-23s-patch.py
          git add index.html expedition.js game.js
          git commit -m 'Scale ARS progression grants and mobile navigation'
          git push origin main
