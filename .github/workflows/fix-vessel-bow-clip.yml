name: Fix restored vessel bow trim

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_vessel_bow_clip.py'
      - '.github/workflows/fix-vessel-bow-clip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_vessel_bow_clip.py
      - run: node --check game.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "Trim restored vessel art at the bow"
          git push
