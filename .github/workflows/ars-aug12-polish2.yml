name: ARS August polish 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-aug12-polish2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct guarded matchers
        run: python tools/fix_aug12_polish2.py
      - name: Apply targeted gameplay polish
        run: python tools/ars_aug12_polish2.py
      - name: Validate JavaScript and requested features
        run: |
          set -euo pipefail
          node --check expedition.js
          node --check game.js
          grep -q "specialistRequirements" expedition.js
          grep -q "expiresAtDay" expedition.js
          grep -q "wildlifeObservationData" expedition.js
          grep -q "TRADE IN & RECEIVE" expedition.js
          grep -q "Russian Nuclear Shipyard" expedition.js
          grep -q "Available equipment by category" expedition.js
          grep -q "wildlifeObservationAvailable(ensureWildlifeId(school))" game.js
          grep -q "selectedResearchTarget.*kind==='grant'" game.js
          grep -q "radius<=420" game.js
          grep -q "expedition-22j-progression" index.html
      - name: Publish changes
        run: |
          set -euo pipefail
          rm -f tools/ars_aug12_polish2.py tools/fix_aug12_polish2.py .github/workflows/ars-aug12-polish2.yml
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add expedition.js game.js index.html tools/ars_aug12_polish2.py tools/fix_aug12_polish2.py .github/workflows/ars-aug12-polish2.yml
          git commit -m 'Tune opportunities wildlife fleet and port flow'
          git push origin HEAD:main
