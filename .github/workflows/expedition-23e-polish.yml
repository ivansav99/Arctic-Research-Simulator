name: Expedition 23e polish and performance

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/expedition_23e_polish.py'
      - '.github/workflows/expedition-23e-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish patch
        run: python .github/scripts/expedition_23e_polish.py
      - name: Validate JavaScript
        run: |
          node --check game.js
          node --check expedition.js
      - name: Validate active 2D runtime
        run: |
          ! grep -q 'relief-3d.js' index.html
          ! grep -q 'relief-3d.css' index.html
          ! grep -q 'AR_3D' game.js
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js expedition.js index.html style.css
          git commit -m "Polish mobile UI navigation grants and performance"
          git push
