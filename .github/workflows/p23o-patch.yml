name: Expedition 23o UI and research split
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p23o-patch.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/p23o_patch.py
      - run: node --check expedition.js
      - run: node --check game.js
      - run: |
          grep -q "expedition-23o-review-split" game.js
          grep -q "accept-opportunity" expedition.js
          grep -q "ek80-scientific-echosounder.webp" expedition.js
          grep -q "cash-balance" index.html
          grep -q "updateResourceBarColors" game.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add expedition.js game.js index.html style.css
          git commit -m "Split research flow and refine mobile HUD" || exit 0
          git push
