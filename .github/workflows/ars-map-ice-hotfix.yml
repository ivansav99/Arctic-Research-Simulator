name: ARS map and ice hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-map-ice-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch ice rendering
        shell: python
        run: |
          from pathlib import Path

          path = Path('game.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "ctx.save();ctx.drawImage(lightCanvas,0,0,width,height);ctx.globalCompositeOperation='source-in';if(!drawIceTexture(iceTextures.fast,.96,380)){ctx.fillStyle='rgba(239,249,246,.88)';ctx.fillRect(0,0,width,height);}ctx.fillStyle='rgba(242,250,250,.10)';ctx.fillRect(0,0,width,height);ctx.restore();light.clearRect(0,0,width,height);",
              "light.save();light.globalCompositeOperation='source-in';if(iceTextureReady(iceTextures.fast)){const w=380,h=380,ax=((state.x*scale*.32)%w+w)%w,ay=((state.y*scale*.32)%h+h)%h,old=light.globalAlpha;light.globalAlpha*=.96;for(let x=-ax-w;x<width+w;x+=w)for(let y=-ay-h;y<height+h;y+=h)light.drawImage(iceTextures.fast,x,y,w,h);light.globalAlpha=old;}else{light.fillStyle='rgba(239,249,246,.88)';light.fillRect(0,0,width,height);}light.globalCompositeOperation='source-atop';light.fillStyle='rgba(242,250,250,.10)';light.fillRect(0,0,width,height);light.restore();ctx.drawImage(lightCanvas,0,0,width,height);light.clearRect(0,0,width,height);",
              'fast ice compositing'
          )

          replace_once(
              "ctx.save();thicknessRing(1);ctx.clip();if(!fillIceClip(iceTextures.pack,'rgba(227,243,248,.08)',.88,340))",
              "ctx.save();thicknessRing(1);ctx.clip();if(!fillIceClip(iceTextures.dense,'rgba(227,243,248,.08)',.88,340))",
              '1 m ice texture'
          )

          replace_once(
              "[[2,iceTextures.dense,'rgba(177,211,224,.13)',.9,350]",
              "[[2,iceTextures.pack,'rgba(177,211,224,.13)',.9,350]",
              '2 m ice texture'
          )

          path.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          old = 'game.js?v=expedition-22c-visuals'
          new = 'game.js?v=expedition-22d-mapfix'
          if html.count(old) != 1:
              raise SystemExit(f'cache bust: expected exactly one match, found {html.count(old)}')
          index.write_text(html.replace(old, new, 1))

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          node --check game.js
          grep -q "thicknessRing(1);ctx.clip();if(!fillIceClip(iceTextures.dense" game.js
          grep -q "\[\[2,iceTextures.pack" game.js
          grep -q "light.globalCompositeOperation='source-in'" game.js
          grep -q "game.js?v=expedition-22d-mapfix" index.html

      - name: Publish hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ars-map-ice-hotfix.yml
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add game.js index.html .github/workflows/ars-map-ice-hotfix.yml
          git commit -m 'Fix ice textures and restore bathymetry rendering'
          git push origin HEAD:main
