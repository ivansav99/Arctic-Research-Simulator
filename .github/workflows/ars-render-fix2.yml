name: ARS render exception fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-render-fix2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore gameplay renderer and fix runtime exception
        run: |
          set -euo pipefail
          git checkout e727c261cbefecb891d536d48f413dbd6c289c72 -- game.js
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js')
          s=p.read_text()
          old="daylight=clamp((lightLevel-.08)/.92,0,1)"
          new="daylight=Math.max(0,Math.min(1,(lightLevel-.08)/.92))"
          if s.count(old)!=1:
              raise SystemExit(f'expected one bad clamp call, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('game.js?v=expedition-22h-renderhotfix','game.js?v=expedition-22i-renderfix')
          p.write_text(s)
          PY
          node --check game.js
          ! grep -q 'daylight=clamp' game.js
          grep -q 'daylight=Math.max' game.js
          grep -q 'researchGuidanceHit' game.js
          grep -q "case'port':tone(520" game.js
          grep -q 'expedition-22i-renderfix' index.html
      - name: Publish corrected gameplay renderer
        run: |
          set -euo pipefail
          rm -f .github/workflows/ars-render-fix2.yml
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add game.js index.html .github/workflows/ars-render-fix2.yml
          git commit -m 'Fix wildlife ring render exception'
          git push origin HEAD:main
