name: ARS 23ae image cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23ae-image-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply cache bump
        run: python .github/ars-23ae-image-cache.py
      - name: Validate JavaScript
        run: |
          node --check expedition.js
          node --check game.js
      - name: Validate cache refs
        run: |
          grep -q "global-rv.webp?v=23ae" expedition.js
          grep -q "icebreaker.webp?v=23ae" expedition.js
          grep -q "expedition-23ae-grant-clarity-images" index.html
      - name: Commit cache bump
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
          git add expedition.js index.html
          git commit -m "Refresh vessel artwork cache keys"
          git push origin main
      - name: Remove temporary patch machinery
        if: success()
        run: |
          rm -f .github/ars-23ae-image-cache.py .github/workflows/ars-23ae-image-cache.yml
          git add -A
          git commit -m "Remove ARS 23ae patch runner"
          git push origin main
