name: Validate cleanup JavaScript

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-cleanup-pass-20260814.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check expedition.js
          node --check glacier-overlay-v2.js
