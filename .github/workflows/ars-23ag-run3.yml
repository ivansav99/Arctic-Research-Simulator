name: ARS 23ag implementation final retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23ag-run3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Make patch resilient to current source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/ars-23ag-patch.py')
          s=p.read_text()
          old="s = replace_once(s, '@media(max-width:760px)', '@media(max-width:1200px)', 'research phone tablet layout')"
          if old in s:
              s=s.replace(old,"s = s.replace('@media(max-width:760px)', '@media(max-width:1200px)')",1)
          call="s = regex_once(s, label_pattern, '', 'remove question-mark labels')"
          if call not in s: raise SystemExit('old label matcher call not found')
          s=s.replace(call,"# map-title cleanup is applied immediately after this patch",1)
          p.write_text(s)
          PY
      - name: Apply gameplay patch
        run: python .github/ars-23ag-patch.py
      - name: Remove opportunity titles under question marks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('game.js'); s=p.read_text()
          old="if(!afterFog&&(zoomLevel>=.55||item.distance<180)){const count=targetStationPoints(target).length,stationText=count?` · ${Math.min(count,(target.stationIndex||0)+1)}/${count}`:'',site=target.siteName?` · ${target.siteName}`:'',label=(target.shortTitle||target.title||'RESEARCH SITE')+stationText+site;ctx.font='800 9px system-ui';ctx.textBaseline='bottom';ctx.lineWidth=3;ctx.strokeStyle='rgba(4,28,42,.94)';ctx.strokeText(label.toUpperCase(),p.x,p.y-19);ctx.fillStyle='#f4fdff';ctx.fillText(label.toUpperCase(),p.x,p.y-19);}"
          if s.count(old)!=1: raise SystemExit(f'opportunity title block count={s.count(old)}')
          p.write_text(s.replace(old,'',1))
          PY
      - name: Validate JavaScript
        run: |
          node --check expedition.js
          node --check game.js
      - name: Validate requested changes
        run: |
          grep -Fq "refreshMs=IS_COARSE_POINTER?95:80" game.js
          grep -Fq "if(floeUpdateAccumulator>=.035)" game.js
          ! grep -Fq "label.toUpperCase(),p.x,p.y-19" game.js
          grep -Fq "SEASONAL ARCTIC AMBIENCE" game.js
          grep -Fq "function missionSpecificSteps" expedition.js
          grep -Fq "MEDIA.helicopter" expedition.js
          grep -Fq "expedition-23ag-smooth-ambient-specific" index.html
          grep -Fq "max-width:1200px" expedition.js
          grep -Fq "max-width:1200px" style.css
      - name: Measure current and offline app size
        continue-on-error: true
        run: python .github/ars-23ag-size.py
      - name: Commit gameplay pass
        run: |
          git add expedition.js game.js style.css index.html
          git commit -m "Smooth Arctic motion and enrich research ambience"
          git push origin HEAD:main
      - name: Remove temporary patch machinery
        run: |
          git pull --rebase origin main
          git rm .github/ars-23ag-patch.py .github/ars-23ag-size.py .github/workflows/ars-23ag-implementation.yml .github/workflows/ars-23ag-run2.yml .github/workflows/ars-23ag-run3.yml
          git commit -m "Remove ARS 23ag patch runners"
          git push origin HEAD:main
