name: ARS 23am clean audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23am-clean-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Remove hum and mystery chimes; strengthen visible-animal audio
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(s, old, new, label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          p=Path('game.js'); s=p.read_text()

          # Remove the continuous oscillator pad completely.
          start="const setupAmbience=c=>{if(ambientPadGain)return;"
          end="};\n    const ensure=()=>{"
          a=s.find(start); b=s.find(end,a)
          if a<0 or b<0: raise SystemExit('ambient setup block not found')
          s=s[:a]+"const setupAmbience=c=>{};\n    const ensure=()=>{"+s[b+len(end):]

          # Remove diagnostic startup tones now that iOS audio is proven working.
          old="const confirm=()=>{if(unlockChimed||c.state!=='running')return;unlockChimed=true;tone(660,.10,.10,0,'sine');tone(880,.14,.09,.10,'sine');};"
          new="const confirm=()=>{if(unlockChimed||c.state!=='running')return;unlockChimed=true;};"
          s=repl(s,old,new,'startup chime')

          # Replace bird sound with a less bell-like short noisy chirp.
          old="case'bird':tone(1800,.08,.03);tone(2350,.08,.025,.1);tone(1600,.09,.02,.2);break;"
          new="case'bird':burst(.16,.022,1700,4600);tone(2450,.045,.012,.025,'triangle');tone(1980,.04,.010,.105,'triangle');break;"
          s=repl(s,old,new,'bird sound texture')

          # Make real animal calls a little more audible.
          s=s.replace("case'whale':tone(145,.9,.045,0,'sine');tone(105,1.2,.035,.4,'sine');break;","case'whale':tone(165,1.0,.075,0,'sine');tone(118,1.35,.060,.38,'sine');break;",1)
          s=s.replace("case'seal':burst(.16,.035,500,1700);tone(330,.16,.025,.04,'square');break;","case'seal':burst(.20,.055,420,1500);tone(360,.20,.040,.04,'triangle');break;",1)
          s=s.replace("case'walrus':burst(.28,.026,110,620);tone(148,.34,.030,.02,'triangle');tone(118,.24,.020,.23,'sine');break;","case'walrus':burst(.34,.045,100,700);tone(165,.42,.048,.02,'triangle');tone(126,.30,.034,.25,'sine');break;",1)

          # Animal ambience should come from wildlife actually visible on the main map,
          # not from an arbitrary 45-km radius.
          old="const nearbyAnimal=()=>{let best=null,dist=45;try{forEachWildlifeVisual((entity,species,category,w)=>{const d=Math.hypot(w.x-state.x,w.y-state.y);if(d<dist){dist=d;best=category;}});}catch(e){}return best;};"
          new="const nearbyAnimal=()=>{let best=null,bestDist=Infinity;try{forEachWildlifeVisual((entity,species,category,w)=>{if(!['whale','seal','walrus','bird'].includes(category))return;const p=worldToScreen(w.x,w.y);if(p.x<0||p.x>width||p.y<70||p.y>height)return;const d=Math.hypot(w.x-state.x,w.y-state.y);if(d<bestDist){bestDist=d;best=category;}});}catch(e){}return best;};"
          s=repl(s,old,new,'visible animal selector')

          # Remove the independent seasonal whistle scheduler entirely.
          s=s.replace("nextBird=0,nextAnimal=0;","nextAnimal=0;",1)
          old="if(!nextBird)nextBird=now+9000+Math.random()*8000;if(season==='summer'&&now>=nextBird){tone(1780,.10,.008,0,'sine');tone(2240,.08,.007,.11,'sine');tone(1960,.09,.006,.23,'sine');nextBird=now+13000+Math.random()*18000;}else if(season!=='summer'&&now>=nextBird)nextBird=now+12000;"
          if old not in s: raise SystemExit('seasonal bird scheduler not found')
          s=s.replace(old,'',1)

          # Zero any legacy pad gain if an old context happens to survive a hot reload.
          old="if(ambientPadGain){const pad=paused?0:{autumn:.0120,winter:.0086,spring:.0136,summer:.0116}[season];ambientPadGain.gain.setTargetAtTime(pad,ac.currentTime,1.3);}"
          if old in s: s=s.replace(old,"if(ambientPadGain)ambientPadGain.gain.setTargetAtTime(0,ac.currentTime,.2);",1)

          # Animal checks begin sooner and repeat often enough to be noticeable,
          # while actual calls remain separated by 18-36 seconds.
          old="if(!nextAnimal)nextAnimal=now+22000+Math.random()*26000;if(now>=nextAnimal){const animal=nearbyAnimal(),type=animal==='walrus'?'walrus':animal;if(['whale','seal','walrus','bird'].includes(type)){play(type);lastAnimal=now;nextAnimal=now+30000+Math.random()*45000;}else nextAnimal=now+12000+Math.random()*10000;}"
          new="if(!nextAnimal)nextAnimal=now+7000+Math.random()*7000;if(now>=nextAnimal){const animal=nearbyAnimal(),type=animal==='walrus'?'walrus':animal;if(['whale','seal','walrus','bird'].includes(type)){play(type);lastAnimal=now;nextAnimal=now+18000+Math.random()*18000;}else nextAnimal=now+7000+Math.random()*6000;}"
          s=repl(s,old,new,'animal schedule')

          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          old='expedition-23al-audible-ambience-no-bell'
          if old not in s: raise SystemExit('cache token not found')
          p.write_text(s.replace(old,'expedition-23am-clean-animal-audio',1))
          PY
      - name: Validate
        run: |
          node --check game.js
          grep -Fq "const setupAmbience=c=>{}" game.js
          ! grep -Fq "for(const freq of[196,293.7])" game.js
          ! grep -Fq "nextBird" game.js
          ! grep -Fq "tone(660,.10,.10" game.js
          grep -Fq "worldToScreen(w.x,w.y)" game.js
          grep -Fq "nextAnimal=now+18000+Math.random()*18000" game.js
          grep -Fq "expedition-23am-clean-animal-audio" index.html
      - name: Commit
        run: |
          git add game.js index.html
          git commit -m "Remove ambient hum and tie animal calls to visible wildlife"
          git push origin HEAD:main
