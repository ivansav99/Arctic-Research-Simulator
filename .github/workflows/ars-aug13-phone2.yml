name: ARS phone UI and navigation polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-aug13-phone2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct guarded patch matchers
        run: |
          python tools/fix_aug13_phone2.py
          python tools/fix_aug13_phone2b.py
          python tools/fix_aug13_phone2c.py
      - name: Apply requested phone and gameplay changes
        run: python tools/ars_aug13_phone2.py
      - name: Validate JavaScript and requested features
        run: |
          set -euo pipefail
          node --check expedition.js
          node --check game.js
          grep -q "short:'Postdoc'" expedition.js
          grep -q "short:'Professor'" expedition.js
          grep -q "name:'Icebreaker'" expedition.js
          grep -q 'data-arx-character-name' expedition.js
          ! grep -q 'Teal parka' expedition.js
          ! grep -q 'open-vessel-port' expedition.js
          grep -q 'Equipment capacity:' expedition.js
          grep -q 'usedPictures' expedition.js
          grep -q 'arx-tab-hint' expedition.js
          grep -q 'pendingResearchArrival' game.js
          grep -q 'localNavigationEscape' game.js
          grep -q "mv-boreal-crown" game.js
          grep -q 'minimapExpanded' game.js
          grep -q 'minimap-nav-details' index.html
          ! grep -q 'id="resume-button"' index.html
          grep -q 'expedition-22m-phone2' index.html
          grep -q 'Expedition 22m' style.css
          test -s assets/vessels/boreal-crown.svg
      - name: Publish changes
        run: |
          set -euo pipefail
          rm -f tools/ars_aug13_phone2.py tools/fix_aug13_phone2.py tools/fix_aug13_phone2b.py tools/fix_aug13_phone2c.py .github/workflows/ars-aug13-phone2.yml
          git config user.name 'ARS Build Bot'
          git config user.email 'ars-build@users.noreply.github.com'
          git add index.html style.css expedition.js game.js assets/vessels/boreal-crown.svg tools/ars_aug13_phone2.py tools/fix_aug13_phone2.py tools/fix_aug13_phone2b.py tools/fix_aug13_phone2c.py .github/workflows/ars-aug13-phone2.yml
          git commit -m 'Polish phone UI navigation and startup flow'
          git push origin HEAD:main
