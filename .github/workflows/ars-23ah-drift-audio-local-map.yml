name: ARS 23ah drift audio local map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23ah-drift-audio-local-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Bundle low-resolution Arctic overview
        run: |
          mkdir -p assets/map
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://wms.gebco.net/2024/north-polar/mapserv?BBOX=-2910000%2C-2910000%2C2910000%2C2910000&crs=EPSG%3A3996&format=image%2Fjpeg&height=2048&layers=GEBCO_NORTH_POLAR_VIEW_bed_2024&request=getmap&service=wms&version=1.3.0&width=2048' \
            -o assets/map/arctic-overview-2048.jpg
          test -s assets/map/arctic-overview-2048.jpg
      - name: Patch passive-drift audio and local overview fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('game.js'); s=p.read_text()
          def rep(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, found {n}')
              s=s.replace(old,new,1)

          rep("let terrainTextureReady=false,terrainTextureFallbackTried=false,terrainTileClock=0;",
              "let terrainTextureReady=false,terrainTextureFallbackStage=0,terrainTileClock=0;",
              'terrain fallback state')
          rep("  const TERRAIN_PRIMARY_URL=terrainWmsUrl(2024,'GEBCO_NORTH_POLAR_VIEW_bed_2024');\n  const TERRAIN_FALLBACK_URL=terrainWmsUrl(2022,'GEBCO_NORTH_POLAR_VIEW_bed_2022');\n  terrainTexture.decoding='async';\n  terrainTexture.onload=()=>{terrainTextureReady=true;};\n  terrainTexture.onerror=()=>{terrainTextureReady=false;if(!terrainTextureFallbackTried){terrainTextureFallbackTried=true;terrainTexture.src=TERRAIN_FALLBACK_URL;}};\n  terrainTexture.src=TERRAIN_PRIMARY_URL;",
              "  const TERRAIN_LOCAL_URL='assets/map/arctic-overview-2048.jpg';\n  const TERRAIN_PRIMARY_URL=terrainWmsUrl(2024,'GEBCO_NORTH_POLAR_VIEW_bed_2024');\n  const TERRAIN_FALLBACK_URL=terrainWmsUrl(2022,'GEBCO_NORTH_POLAR_VIEW_bed_2022');\n  terrainTexture.decoding='async';\n  terrainTexture.onload=()=>{terrainTextureReady=true;};\n  terrainTexture.onerror=()=>{terrainTextureReady=false;if(terrainTextureFallbackStage===0){terrainTextureFallbackStage=1;terrainTexture.src=TERRAIN_PRIMARY_URL;}else if(terrainTextureFallbackStage===1){terrainTextureFallbackStage=2;terrainTexture.src=TERRAIN_FALLBACK_URL;}};\n  terrainTexture.src=TERRAIN_LOCAL_URL;",
              'local overview source')
          rep("if(waveGain)waveGain.gain.setTargetAtTime((!paused&&state.moving&&!state.ramming)?0.045:0,ac.currentTime,.22);",
              "if(waveGain)waveGain.gain.setTargetAtTime((!paused&&state.commandActive&&state.moving&&!state.ramming)?0.045:0,ac.currentTime,.22);",
              'command-only wave wash')
          rep("{autumn:.008,winter:.018,spring:.007,summer:.004}",
              "{autumn:.012,winter:.026,spring:.011,summer:.007}",
              'ambient wind level')
          rep("{autumn:.0023,winter:.0015,spring:.0027,summer:.0021}",
              "{autumn:.0034,winter:.0024,spring:.0038,summer:.0032}",
              'ambient tonal level')
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          old='expedition-23ag-smooth-ambient-specific'
          if old not in s: raise SystemExit('cache version not found')
          p.write_text(s.replace(old,'expedition-23ah-drift-audio-local-map'))
          PY
      - name: Validate
        run: |
          node --check game.js
          grep -Fq "state.commandActive&&state.moving" game.js
          grep -Fq "TERRAIN_LOCAL_URL='assets/map/arctic-overview-2048.jpg'" game.js
          grep -Fq "expedition-23ah-drift-audio-local-map" index.html
          test -s assets/map/arctic-overview-2048.jpg
          du -h assets/map/arctic-overview-2048.jpg
      - name: Commit
        run: |
          git add game.js index.html assets/map/arctic-overview-2048.jpg
          git commit -m "Silence passive drift and bundle Arctic overview"
          git push origin HEAD:main
