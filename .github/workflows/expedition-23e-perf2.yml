name: Expedition 23e runtime performance

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/expedition_23e_perf2.py'
      - '.github/workflows/expedition-23e-perf2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/expedition_23e_perf2.py
      - run: node --check game.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "Reduce background map simulation cost"
          git push
