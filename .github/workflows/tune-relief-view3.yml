name: Tune 3D vessel position and terrain range

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/tune_relief_view3.py'
      - '.github/workflows/tune-relief-view3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 3D view tuning
        run: python .github/scripts/tune_relief_view3.py
      - name: Validate JavaScript
        run: node --check relief-3d.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relief-3d.js relief-3d.css index.html
          git commit -m "Raise vessel and extend 3D terrain range"
          git push
