name: ARS 23x restore port helpers

on:
  push:
    branches: [reimplement-23x-safe]
    paths:
      - '.github/workflows/ars-23x-restore-port-helpers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reimplement-23x-safe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore swallowed port helpers
        run: python .github/ars-23x-restore-port-helpers.py
      - name: Validate JavaScript syntax
        run: |
          node --check expedition.js
          node --check game.js
      - name: Validate restored helper block
        run: |
          test $(grep -c "function activeGrantCard" expedition.js) -eq 1
          test $(grep -c "function collectingGrantCard" expedition.js) -eq 1
          test $(grep -c "function relocationPorts" expedition.js) -eq 1
          test $(grep -c "function relocationPanelMarkup" expedition.js) -eq 1
          test $(grep -c "function relocateHomePort" expedition.js) -eq 1
          test $(grep -c "function capturePortView" expedition.js) -eq 1
          test $(grep -c "function resupplyAllQuote" expedition.js) -eq 1
          test $(grep -c "function pointIsSpaced" expedition.js) -eq 1
          grep -F "shop-equipment" expedition.js
          grep -F "coastal:[950,1700]" expedition.js
      - name: Commit restored helpers
        run: |
          rm -f .github/ars-23x-restore-port-helpers.py .github/workflows/ars-23x-restore-port-helpers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add expedition.js .github
          git commit -m 'Restore port helpers after grant card edit'
          git push origin HEAD:reimplement-23x-safe
