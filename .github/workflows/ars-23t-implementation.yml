name: ARS 23t implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/ars-23t-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply ARS 23t patch
        run: python .github/ars-23t-patch.py
      - name: Validate JavaScript
        run: |
          node --check expedition.js
          node --check game.js
      - name: Validate patch markers
        run: |
          grep -q "assets/vessels/coastal-rv.webp" expedition.js
          grep -q "GRANT NOT READY" expedition.js
          grep -q "context.preview" expedition.js
          grep -q "Math.max(45,portBuffer)" game.js
          grep -q "preview:true" game.js
          grep -q "expedition-23t-grants-vessels-map" index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expedition.js game.js index.html
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "Refine ARS grants maps and vessel art"
          git push
