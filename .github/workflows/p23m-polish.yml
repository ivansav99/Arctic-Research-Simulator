name: Expedition 23m canonical media polish
on:
  push:
    paths:
      - '.github/workflows/p23m-polish.yml'
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate canonical media
        run: |
          set +e
          python3 - <<'PY' > p23m-polish-diagnostic.txt 2>&1
          from pathlib import Path
          import re
          p=Path('expedition.js');s=p.read_text()
          patterns=[
            (r"function mediaMarkup\(item, className=' '\)",''),
          ]
          old="const media=item?.media;"
          print('media assignment matches',s.count(old))
          if s.count(old)!=1: raise SystemExit(f'media assignment patch: {s.count(old)}')
          s=s.replace(old,"const media=item?.templateId?canonicalMissionMedia(item):item?.media;",1)
          old="stationSpacingKm:4, media:MEDIA.aerial, description:'Count summer waterfowl"
          print('duck media matches',s.count(old))
          if s.count(old)!=1: raise SystemExit(f'duck media patch: {s.count(old)}')
          s=s.replace(old,"stationSpacingKm:4, media:MEDIA.cameraTelephoto, description:'Count summer waterfowl",1)
          old="name:'eDNA & Coastal Ecology Lab', price:65000, slotType:'medium', slots:1, tier:2, specialties:['coastal-ecology','sea-ice-ecology'], crew:[{specialties:['coastal-ecology','sea-ice-ecology'], minCareer:'postdoc', count:1}], description:'Filtration and preservation system for biodiversity surveys.', specs:['Sterile filtration bench','Field blanks and freezer','Postdoc-level lab lead'], media:MEDIA.local"
          print('edna lab matches',s.count(old))
          if s.count(old)!=1: raise SystemExit(f'edna lab media patch: {s.count(old)}')
          s=s.replace(old,old[:-len('MEDIA.local')]+'MEDIA.ednaKit',1)
          old="steps:['File the survey corridor','Check aircraft and payload','Launch from the helideck','Fly the thermal-image leg','Recover before the next corridor']"
          print('fixed wing steps matches',s.count(old))
          if s.count(old)!=1: raise SystemExit(f'fixed wing steps patch: {s.count(old)}')
          s=s.replace(old,"steps:['File the survey corridor','Check aircraft and payload','Launch from the deck cradle','Fly the thermal-image leg','Recover to the deck system']",1)
          p.write_text(s)
          PY
          patch=$?
          echo "patch=$patch" >> p23m-polish-diagnostic.txt
          if [ "$patch" -eq 0 ]; then
            node --check expedition.js >> p23m-polish-diagnostic.txt 2>&1; s1=$?
            git diff --check >> p23m-polish-diagnostic.txt 2>&1; s2=$?
            grep -Fq "item?.templateId?canonicalMissionMedia(item):item?.media" expedition.js; s3=$?
            grep -Fq "media:MEDIA.cameraTelephoto, description:'Count summer waterfowl" expedition.js; s4=$?
            grep -Fq "Postdoc-level lab lead'], media:MEDIA.ednaKit" expedition.js; s5=$?
            grep -Fq "Launch from the deck cradle" expedition.js; s6=$?
            echo "validation=$s1,$s2,$s3,$s4,$s5,$s6" >> p23m-polish-diagnostic.txt
            if [ "$s1$s2$s3$s4$s5$s6" = "000000" ]; then touch p23m-polish-success; fi
          fi
          cat p23m-polish-diagnostic.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f p23m-polish-success ]; then
            git add expedition.js p23m-polish-diagnostic.txt
            git commit -m "Use canonical media across research missions"
          else
            git add p23m-polish-diagnostic.txt
            git commit -m "Record canonical media polish diagnostic"
          fi
          git push
