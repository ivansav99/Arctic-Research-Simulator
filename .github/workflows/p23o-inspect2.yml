name: Expedition 23o inspect two
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p23o-inspect2.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/p23o_inspect2.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add p23o-inspect2.txt
          git commit -m "Write p23o inspection two" || exit 0
          git push
