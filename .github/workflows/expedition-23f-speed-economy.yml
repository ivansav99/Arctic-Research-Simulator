name: Expedition 23f speed economy
on:
  push:
    paths:
      - '.github/workflows/expedition-23f-speed-economy.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build patch script
        run: cat .github/scripts/p23f_0 .github/scripts/p23f_1 .github/scripts/p23f_2 .github/scripts/p23f_3 > /tmp/patch.py
      - name: Apply patch
        run: python /tmp/patch.py
      - name: Validate JavaScript
        run: |
          node --check expedition.js
          node --check game.js
          test -z "$(grep -E 'relief-3d|AR_3D' index.html game.js || true)"
      - name: Validate requested values
        run: |
          grep -q "price:350000" expedition.js
          grep -q "10 citations each" expedition.js
          grep -q "PURCHASE AFTER TRADE-IN" expedition.js
          grep -q "case'depart'" game.js
          grep -q "drawVesselTrack" game.js
          grep -q "IS_COARSE_POINTER?1.35:2" game.js
          grep -q "expedition-23f-speed-economy" index.html
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expedition.js game.js index.html
          git commit -m "Speed up mobile sailing and polish expedition economy"
          git push
