name: Apply Expedition 21
on:
  push:
    paths:
      - '.stage/exp21-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .stage/exp21-b64-00 | base64 -d | gzip -d > /tmp/exp21.patch
          echo 'e657650d39cb5bad8e96d2badde2e4dc9537a94e9e9f54a1969d8c7f5fa37690  /tmp/exp21.patch' | sha256sum -c -
          echo 'aa29749a5a9ca1835a5f626971cfcdcd77ada22114517db81a156ff8de9ff37e  game.js' | sha256sum -c -
          echo '1efc998e5ba6025144ae2fa8e2b415eab9159edde9e405ea1b182e8fbca8468c  expedition.js' | sha256sum -c -
          echo '812faa2421dbf26d68a2b5f8d93bf2cc007139f8327fe1eb5252295f540eb29d  index.html' | sha256sum -c -
          git apply --check /tmp/exp21.patch
      - name: Apply and test Expedition 21
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/exp21.patch
          node --check game.js
          node --check expedition.js
          echo 'eb04e98d1a9cd13036e9617eecaa21e9a09b596ef12b3eaa5d6b858e591d2d55  game.js' | sha256sum -c -
          echo '9c66db149364c4e0c05295861ded29e7ef90d62bf49b6565b0111bcc13b6a016  expedition.js' | sha256sum -c -
          echo 'bf544ee368c2cfacfc88609f9b81f8df1d7730b6e873751f5448c1a8c2add290  index.html' | sha256sum -c -
      - name: Commit production update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .stage/exp21-b64-* .stage/exp21-trigger.txt .github/workflows/apply-exp21.yml
          rmdir .stage 2>/dev/null || true
          git config user.name 'ARS Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Upgrade vessel visuals, drift heading, and icebreaking'
          git push origin HEAD:main
