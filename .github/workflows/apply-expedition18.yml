name: Apply Expedition 18
on:
  push:
    paths:
      - '.stage/exp18-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .stage/exp18-part-* > /tmp/exp18.patch
          echo "4c9fab69d95e3f75c0e6429280b0dc32b0fb36f33d7d51a6b03a2a3d8374c885  /tmp/exp18.patch" | sha256sum -c -
          grep -q "GAME_VERSION='expedition-17'" game.js
          git apply --check /tmp/exp18.patch
          git apply /tmp/exp18.patch
          node --check game.js
          node --check expedition.js
          grep -q "GAME_VERSION='expedition-18'" game.js
          grep -q "game.js?v=expedition-18" index.html
          grep -q "expedition.js?v=expedition-18" index.html
      - name: Commit Expedition 18
        shell: bash
        run: |
          rm -rf .stage
          rm -f .github/workflows/apply-expedition18.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add vessel ice classes, home-port relocation, and test console"
          git push
