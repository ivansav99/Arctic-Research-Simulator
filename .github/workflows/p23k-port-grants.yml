name: Expedition 23k port and grants repair
on:
  push:
    paths:
      - '.github/workflows/p23k-port-grants.yml'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/p23k_port_grants.py
      - name: Validate runtime
        run: |
          node --check game.js
          node --check expedition.js
          git diff --check
          ! grep -q "vesselRewardScale" expedition.js
          grep -q "expedition-23k-port-grants" index.html
          grep -q "scan(3,72,3,24)" game.js
          grep -q "},24);" game.js
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js expedition.js index.html
          git diff --cached --quiet && { echo 'No runtime changes'; exit 1; }
          git commit -m "Fix grant generation and port click latency"
          git push
