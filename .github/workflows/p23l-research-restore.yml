name: Expedition 23l restore research system
on:
  push:
    paths:
      - '.github/workflows/p23l-research-restore.yml'
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply research restore
        run: python3 .github/scripts/p23l_research_restore.py
      - name: Syntax and static checks
        run: |
          node --check expedition.js
          git diff --check
          grep -q "function templateCareerLevel" expedition.js
          grep -q "function missionMinCrew" expedition.js
          grep -q "function specialistAssignment" expedition.js
          grep -q "function missionFitsCurrentVessel" expedition.js
          grep -q "function vesselRewardScale" expedition.js
          grep -q "expedition-23l-research" index.html
      - name: Smoke test grants and field opportunities
        run: |
          node <<'NODE'
          const fs=require('fs'), vm=require('vm');
          let src=fs.readFileSync('expedition.js','utf8');
          const marker='window.ArcticResearch=api;';
          if(!src.includes(marker)) throw new Error('API export marker missing');
          src=src.replace(marker, marker+'window.__researchSmoke={state,generateOffers,maybeSpawnOpportunity};');
          global.window={};
          vm.runInThisContext(src,{filename:'expedition.js'});
          const t=window.__researchSmoke;
          if(!t) throw new Error('Research smoke hook unavailable');
          const port={name:'Longyearbyen',lat:78.23,lon:15.65,id:'longyearbyen',country:'Norway',countryCode:'NO'};
          t.state.port=port; t.state.portVisits=1; t.state.offers=[]; t.state.grantOfferCycle=null;
          t.generateOffers(port,{fresh:true});
          if(!t.state.offers.length) throw new Error('No port grant offers generated');
          console.log('PORT_GRANTS',t.state.offers.length,t.state.offers.map(x=>x.shortTitle).join('|'));
          t.state.port=null;
          const before=t.state.targets.length;
          const opportunity=t.maybeSpawnOpportunity({position:{lat:78.30,lon:15.20},fjord:true,coastal:true,coastDistanceKm:10,weather:{type:'clear'},iceThickness:0});
          if(!opportunity || t.state.targets.length<=before) throw new Error('No at-sea research opportunity generated');
          console.log('FIELD_OPPORTUNITY',opportunity.shortTitle);
          NODE
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expedition.js index.html
          git diff --cached --quiet && { echo 'No runtime changes'; exit 1; }
          git commit -m "Restore research grants and field opportunities"
          git push
