name: Expedition 23e polish retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expedition-23e-polish-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make grant patch whitespace-tolerant
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/expedition_23e_polish.py')
          s=p.read_text()
          old="e=once(e,old_gen,new_gen,'fast unique grant offers')"
          new="e=sub_once(e,r\"    state\\.offers=\\[\\]; const specialtyCount=.*?if\\(fallback\\)state\\.offers\\.push\\(fallback\\);\\}\",new_gen.strip(),'fast unique grant offers')"
          if old not in s: raise SystemExit('grant call marker missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Apply polish patch
        run: python .github/scripts/expedition_23e_polish.py
      - name: Validate JavaScript
        run: |
          node --check game.js
          node --check expedition.js
      - name: Validate active 2D runtime
        run: |
          ! grep -q 'relief-3d.js' index.html
          ! grep -q 'relief-3d.css' index.html
          ! grep -q 'AR_3D' game.js
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js expedition.js index.html style.css
          git commit -m "Polish mobile UI navigation grants and performance"
          git push
