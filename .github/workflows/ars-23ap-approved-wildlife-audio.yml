name: ARS 23ap approved wildlife audio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23ap-approved-wildlife-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download approved wildlife recordings
        run: |
          set -euo pipefail
          mkdir -p assets/audio/wildlife /tmp/ars-audio

          # Better beluga clip approved during listening review.
          curl -L --fail --retry 3 -o /tmp/ars-audio/beluga.mp3 \
            'https://www.fisheries.noaa.gov/s3/2023-04/Dele-multisound-NOAA-Castellote-01-beluga-clip.mp3'
          curl -L --fail --retry 3 -o /tmp/ars-audio/bearded-seal.mp3 \
            'https://www.fisheries.noaa.gov/s3/2023-04/Erba-Multisound-Cornell-OrnithologyLab-01-bearded-seal-clip.mp3'
          curl -L --fail --retry 3 -o /tmp/ars-audio/harp-seal.mp3 \
            'https://www.fisheries.noaa.gov/s3/2023-04/Pagr-call-NPI-Van-Parijs-02-harp-seal-clip.mp3'
          curl -L --fail --retry 3 -o /tmp/ars-audio/bowhead.mp3 \
            'https://dosits.org/wp-content/uploads/2017/05/bow2.mp3'
          curl -L --fail --retry 3 -o /tmp/ars-audio/common-eider.ogg \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Common_Eider_(Somateria_mollissima)_(W1CDR0001491_BD11).ogg'
          curl -L --fail --retry 3 -o /tmp/ars-audio/pink-footed-goose.ogg \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pink-footed_Geese_(Anser_brachyrhynchus)_(W1CDR0001376_BD33).ogg'
          curl -L --fail --retry 3 -o /tmp/ars-audio/brent-goose.ogg \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Brent_Goose_(Branta_bernicla)_(W_BRANTA_BERNICLA_R1_C11).ogg'

          for item in beluga bearded-seal harp-seal bowhead common-eider pink-footed-goose brent-goose; do
            input=$(find /tmp/ars-audio -maxdepth 1 -type f -name "$item.*" | head -1)
            ffmpeg -hide_banner -loglevel error -y -i "$input" \
              -af "silenceremove=start_periods=1:start_threshold=-46dB,loudnorm=I=-16:TP=-1.5:LRA=7" \
              -t 6 -ac 1 -ar 44100 -codec:a libmp3lame -b:a 72k \
              "assets/audio/wildlife/$item.mp3"
            test -s "assets/audio/wildlife/$item.mp3"
          done

          cat > assets/audio/wildlife/CREDITS.md <<'EOF'
          # Wildlife audio credits

          Short mono derivatives are normalized and trimmed for Arctic Research Simulator.

          ## Approved wildlife set

          - `beluga.mp3` — Beluga Whale exemplar call. NOAA Fisheries, Northeast Fisheries Science Center, Passive Acoustics Branch, “Sounds in the Ocean: Mammals.” Source file `Dele-multisound-NOAA-Castellote-01-beluga-clip.mp3`.
          - `bearded-seal.mp3` — Bearded Seal exemplar call. NOAA Fisheries, “Sounds in the Ocean: Mammals.” Source file `Erba-Multisound-Cornell-OrnithologyLab-01-bearded-seal-clip.mp3`.
          - `harp-seal.mp3` — Harp Seal exemplar call. NOAA Fisheries, “Sounds in the Ocean: Mammals.” Source file `Pagr-call-NPI-Van-Parijs-02-harp-seal-clip.mp3`.
          - `bowhead.mp3` — Bowhead whale moans recorded off Point Barrow, Alaska. Discovery of Sound in the Sea (DOSITS); sound credited there to North Slope Borough, Barrow, Alaska.
          - `common-eider.mp3` — Common Eider calls recorded at Loch Beag, Scotland, by Aubrey John Williams / British Library. Wikimedia Commons. CC BY-SA 4.0; trimmed/normalized derivative remains CC BY-SA 4.0.
          - `pink-footed-goose.mp3` — Pink-footed Geese flock calls recorded at Caerlaverock, Scotland, by Lawrence Shove / British Library. Wikimedia Commons. CC BY-SA 4.0; trimmed/normalized derivative remains CC BY-SA 4.0.
          - `brent-goose.mp3` — Brent Goose calls, British Library collection via Wikimedia Commons. Follow the license/attribution terms on the source file page; this is a trimmed/normalized derivative.
          - `humpback.mp3` — Song of Humpback Whales. Wikimedia Commons `Humpbackwhale2.ogg`, author Spyrogumas. CC0 1.0.
          - `walrus.mp3` — Walruses Hauled Out on the Northwest Coast of Alaska. Anthony Fischbach, U.S. Geological Survey Alaska Science Center. Public domain.
          - `arctic-tern.mp3` — Arctic Tern XC564600. Recordist Doug Hynes; Xeno-canto / Wikimedia Commons. CC BY-SA 4.0; trimmed/normalized derivative remains CC BY-SA 4.0.

          Source pages:
          - https://www.fisheries.noaa.gov/national/science-data/sounds-ocean-mammals
          - https://dosits.org/animals/use-of-sound/marine-mammal-navigation/
          - https://commons.wikimedia.org/wiki/File:Common_Eider_(Somateria_mollissima)_(W1CDR0001491_BD11).ogg
          - https://commons.wikimedia.org/wiki/File:Pink-footed_Geese_(Anser_brachyrhynchus)_(W1CDR0001376_BD33).ogg
          - https://commons.wikimedia.org/wiki/File:Brent_Goose_(Branta_bernicla)_(W_BRANTA_BERNICLA_R1_C11).ogg
          - https://commons.wikimedia.org/wiki/File:Humpbackwhale2.ogg
          - https://www.usgs.gov/media/audio/walruses-hauled-out-northwest-coast-alaska
          - https://commons.wikimedia.org/wiki/File:Sterna_paradisaea_-_Arctic_Tern_XC564600.mp3

          Note: NOAA/DOSITS source-credit and redistribution terms should be re-checked before a commercial App Store release; this file preserves provenance so that review is straightforward.
          EOF
      - name: Patch full-volume cards and quiet random ambience
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(s, old, new, label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              return s.replace(old,new,1)

          p=Path('game.js'); s=p.read_text()

          old="""    const ANIMAL_SAMPLE_SOURCES={
      'BELUGA':'assets/audio/wildlife/beluga.mp3',
      'HUMPBACK':'assets/audio/wildlife/humpback.mp3',
      'WALRUS':'assets/audio/wildlife/walrus.mp3',
      'ARCTIC TERN':'assets/audio/wildlife/arctic-tern.mp3'
    };"""
          new="""    const ANIMAL_SAMPLE_SOURCES={
      'BELUGA':'assets/audio/wildlife/beluga.mp3',
      'HUMPBACK':'assets/audio/wildlife/humpback.mp3',
      'BOWHEAD':'assets/audio/wildlife/bowhead.mp3',
      'WALRUS':'assets/audio/wildlife/walrus.mp3',
      'BEARDED SEAL':'assets/audio/wildlife/bearded-seal.mp3',
      'HARP SEAL':'assets/audio/wildlife/harp-seal.mp3',
      'ARCTIC TERN':'assets/audio/wildlife/arctic-tern.mp3',
      'COMMON EIDER':'assets/audio/wildlife/common-eider.mp3',
      'PINK-FOOTED GOOSE':'assets/audio/wildlife/pink-footed-goose.mp3',
      'BRENT GOOSE':'assets/audio/wildlife/brent-goose.mp3'
    };"""
          s=repl(s,old,new,'animal source map')

          old="const playAnimal=species=>{const c=ensure(),key=String(species||'').toUpperCase(),buffer=animalBuffers[key];if(!c||!ANIMAL_SAMPLE_SOURCES[key])return false;if(!buffer){loadAnimalSamples(c);return false;}const src=c.createBufferSource(),g=c.createGain();src.buffer=buffer;g.gain.value=.42;src.connect(g).connect(c.destination);const run=()=>src.start();if(c.state!=='running'){Promise.resolve(c.resume()).then(()=>{if(c.state==='running')run();}).catch(()=>{});}else run();return true;};"
          new="const playAnimal=(species,{ambient=false}={})=>{const c=ensure(),key=String(species||'').toUpperCase(),buffer=animalBuffers[key];if(!c||!ANIMAL_SAMPLE_SOURCES[key])return false;if(!buffer){loadAnimalSamples(c);return false;}const src=c.createBufferSource(),g=c.createGain();src.buffer=buffer;g.gain.value=ambient?.12:1;src.connect(g).connect(c.destination);const run=()=>src.start();if(c.state!=='running'){Promise.resolve(c.resume()).then(()=>{if(c.state==='running')run();}).catch(()=>{});}else run();if(!ambient)nextAnimal=performance.now()+26000+Math.random()*16000;return true;};"
          s=repl(s,old,new,'animal gain modes')

          old="const nearbyAnimal=()=>{let best=null,bestDist=Infinity;try{forEachWildlifeVisual((entity,species,category,w)=>{const key=String(species||'').toUpperCase();if(!ANIMAL_SAMPLE_SOURCES[key])return;const p=worldToScreen(w.x,w.y);if(p.x<0||p.x>width||p.y<70||p.y>height)return;const d=Math.hypot(w.x-state.x,w.y-state.y);if(d<bestDist){bestDist=d;best=key;}});}catch(e){}return best;};"
          new="const visibleAnimalSamples=()=>{const choices=[];try{forEachWildlifeVisual((entity,species,category,w)=>{const key=String(species||'').toUpperCase();if(!ANIMAL_SAMPLE_SOURCES[key])return;const p=worldToScreen(w.x,w.y);if(p.x<0||p.x>width||p.y<70||p.y>height)return;choices.push(key);});}catch(e){}return choices;};"
          s=repl(s,old,new,'visible animal samples')

          old="if(!nextAnimal)nextAnimal=now+7000+Math.random()*7000;if(now>=nextAnimal){const species=nearbyAnimal();if(species&&playAnimal(species)){lastAnimal=now;nextAnimal=now+22000+Math.random()*22000;}else nextAnimal=now+6000+Math.random()*5000;}"
          new="if(!nextAnimal)nextAnimal=now+9000+Math.random()*9000;if(now>=nextAnimal){const choices=visibleAnimalSamples(),species=choices.length?choices[Math.floor(Math.random()*choices.length)]:null;if(species&&playAnimal(species,{ambient:true})){lastAnimal=now;nextAnimal=now+20000+Math.random()*28000;}else nextAnimal=now+7000+Math.random()*7000;}"
          s=repl(s,old,new,'random quiet visible wildlife ambience')

          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          import re
          s,n=re.subn(r"game\.js\?v=[^\"']+","game.js?v=expedition-23ap-approved-wildlife-audio",s,count=1)
          if n!=1: raise SystemExit(f'game cache replacements={n}')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check game.js
          grep -Fq "'BOWHEAD':'assets/audio/wildlife/bowhead.mp3'" game.js
          grep -Fq "'BEARDED SEAL':'assets/audio/wildlife/bearded-seal.mp3'" game.js
          grep -Fq "'HARP SEAL':'assets/audio/wildlife/harp-seal.mp3'" game.js
          grep -Fq "'COMMON EIDER':'assets/audio/wildlife/common-eider.mp3'" game.js
          grep -Fq "g.gain.value=ambient?.12:1" game.js
          grep -Fq "playAnimal(species,{ambient:true})" game.js
          grep -Fq "sound.playAnimal?.(animal.species)" game.js
          grep -Fq "game.js?v=expedition-23ap-approved-wildlife-audio" index.html
          for f in beluga bowhead bearded-seal harp-seal common-eider pink-footed-goose brent-goose humpback walrus arctic-tern; do test -s "assets/audio/wildlife/$f.mp3"; done
      - name: Commit
        run: |
          git add game.js index.html assets/audio/wildlife
          git commit -m "Expand real wildlife audio and separate card ambience volume"
          git push origin HEAD:main
