name: ARS 23ap wildlife audio Dryad retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23ap-run4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip
      - name: Download and normalize approved recordings
        run: |
          set -euo pipefail
          mkdir -p assets/audio/wildlife /tmp/ars-audio /tmp/bowhead
          curl -L --fail --retry 3 -o /tmp/ars-audio/beluga.mp3 'https://www.fisheries.noaa.gov/s3/2023-04/Dele-multisound-NOAA-Castellote-01-beluga-clip.mp3'
          curl -L --fail --retry 3 -o /tmp/ars-audio/bearded-seal.mp3 'https://www.fisheries.noaa.gov/s3/2023-04/Erba-Multisound-Cornell-OrnithologyLab-01-bearded-seal-clip.mp3'
          curl -L --fail --retry 3 -o /tmp/ars-audio/harp-seal.mp3 'https://www.fisheries.noaa.gov/s3/2023-04/Pagr-call-NPI-Van-Parijs-02-harp-seal-clip.mp3'
          curl -L --fail --retry 3 -o /tmp/ars-audio/bowhead.zip 'https://datadryad.org/downloads/file_stream/7279'
          bowfile=$(unzip -Z1 /tmp/ars-audio/bowhead.zip | grep -Ei '2012.*11.*\.mp3$' | head -1 || true)
          if [ -z "$bowfile" ]; then bowfile=$(unzip -Z1 /tmp/ars-audio/bowhead.zip | grep -Ei '\.mp3$' | head -1); fi
          unzip -p /tmp/ars-audio/bowhead.zip "$bowfile" > /tmp/ars-audio/bowhead.mp3
          test -s /tmp/ars-audio/bowhead.mp3
          echo "Selected Dryad bowhead exemplar: $bowfile"
          curl -L --fail --retry 3 -o /tmp/ars-audio/common-eider.ogg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Common_Eider_(Somateria_mollissima)_(W1CDR0001491_BD11).ogg'
          curl -L --fail --retry 3 -o /tmp/ars-audio/pink-footed-goose.ogg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pink-footed_Geese_(Anser_brachyrhynchus)_(W1CDR0001376_BD33).ogg'
          curl -L --fail --retry 3 -o /tmp/ars-audio/brent-goose.ogg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Brent_Goose_(Branta_bernicla)_(W_BRANTA_BERNICLA_R1_C11).ogg'
          for item in beluga bearded-seal harp-seal bowhead common-eider pink-footed-goose brent-goose; do
            input=$(find /tmp/ars-audio -maxdepth 1 -type f -name "$item.*" ! -name '*.zip' | head -1)
            ffmpeg -hide_banner -loglevel error -y -i "$input" -af "silenceremove=start_periods=1:start_threshold=-46dB,loudnorm=I=-16:TP=-1.5:LRA=7" -t 6 -ac 1 -ar 44100 -codec:a libmp3lame -b:a 72k "assets/audio/wildlife/$item.mp3"
            test -s "assets/audio/wildlife/$item.mp3"
          done
      - name: Patch game
        run: python .github/ars-23ap-patch.py
      - name: Update credits
        run: |
          cat >> assets/audio/wildlife/CREDITS.md <<'EOF'

          ## Additional approved species recordings — 23ap

          - `beluga.mp3` — alternative Beluga Whale exemplar from NOAA Fisheries, Northeast Fisheries Science Center Passive Acoustics Branch, `Dele-multisound-NOAA-Castellote-01-beluga-clip.mp3`.
          - `bearded-seal.mp3` — Bearded Seal exemplar from NOAA Fisheries, `Erba-Multisound-Cornell-OrnithologyLab-01-bearded-seal-clip.mp3`.
          - `harp-seal.mp3` — Harp Seal exemplar from NOAA Fisheries, `Pagr-call-NPI-Van-Parijs-02-harp-seal-clip.mp3`.
          - `bowhead.mp3` — Bowhead Whale song exemplar from Stafford, Lydersen, Wiig & Kovacs (2018), *Extreme diversity in the songs of Spitsbergen's bowhead whales*, Dryad dataset DOI 10.5061/dryad.1ck400f. Recorded in Fram Strait.
          - `common-eider.mp3` — Common Eider field recording from the British Library collection via Wikimedia Commons, CC BY-SA 4.0; trimmed/normalized derivative.
          - `pink-footed-goose.mp3` — Pink-footed Geese field recording from the British Library collection via Wikimedia Commons, CC BY-SA 4.0; trimmed/normalized derivative.
          - `brent-goose.mp3` — Brent Goose field recording from the British Library collection via Wikimedia Commons; trimmed/normalized derivative. Verify exact source-page attribution terms before commercial release.

          NOAA/Dryad/source-page attribution and redistribution terms should be reviewed again before commercial App Store release. Provenance is retained here for that review.
          EOF
      - name: Validate
        run: |
          node --check game.js
          grep -Fq "'BOWHEAD':'assets/audio/wildlife/bowhead.mp3'" game.js
          grep -Fq "'BEARDED SEAL':'assets/audio/wildlife/bearded-seal.mp3'" game.js
          grep -Fq "'HARP SEAL':'assets/audio/wildlife/harp-seal.mp3'" game.js
          grep -Fq "'COMMON EIDER':'assets/audio/wildlife/common-eider.mp3'" game.js
          grep -Fq "'PINK-FOOTED GOOSE':'assets/audio/wildlife/pink-footed-goose.mp3'" game.js
          grep -Fq "'BRENT GOOSE':'assets/audio/wildlife/brent-goose.mp3'" game.js
          grep -Fq "g.gain.value=ambient?.12:1" game.js
          grep -Fq "playAnimal(species,{ambient:true})" game.js
          grep -Fq "game.js?v=expedition-23ap-approved-wildlife-audio" index.html
          for f in beluga bowhead bearded-seal harp-seal common-eider pink-footed-goose brent-goose humpback walrus arctic-tern; do test -s "assets/audio/wildlife/$f.mp3"; done
      - name: Commit
        run: |
          git add game.js index.html assets/audio/wildlife
          git commit -m "Expand approved wildlife recordings and ambience"
          git push origin HEAD:main
