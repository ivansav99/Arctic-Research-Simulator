name: ARS 23x stage 2 safe

on:
  push:
    branches: [reimplement-23x-safe]
    paths:
      - '.github/workflows/ars-23x-stage2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reimplement-23x-safe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply stage 2
        run: python .github/ars-23x-stage2.py
      - name: Validate JavaScript syntax
        run: |
          node --check expedition.js
          node --check game.js
      - name: Validate critical behavior markers
        run: |
          grep -F "function pointIsSpaced" expedition.js
          grep -F "coastal:[950,1700]" expedition.js
          grep -F "opportunityMoveGateKm" expedition.js
          grep -F "live.length>=2" expedition.js
          grep -F "recentOpportunityTemplates" expedition.js
          grep -F "templateCareerLevel(item)<=careerFloor" expedition.js
          grep -F "GRANT NOT READY" expedition.js
          grep -F "shop-equipment" expedition.js
          grep -F "best=36" game.js
          grep -F "if(official)return true" game.js
          grep -F "grantBuffer" game.js
          grep -F "distanceWindow:window" expedition.js
          grep -F "expedition-23x-safe-reimplementation" index.html
      - name: Sanity-check dangerous regressions
        run: |
          ! grep -F "let point=template.anywhere ? {...origin}" expedition.js
          test $(grep -c "function pointIsSpaced" expedition.js) -eq 1
          test $(grep -c "function isResearchSiteSuitable" game.js) -eq 1
          test $(grep -c "function maybeSpawnOpportunity" expedition.js) -eq 1
      - name: Commit validated stage 2
        run: |
          rm -f .github/ars-23x-stage2.py .github/workflows/ars-23x-stage2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add expedition.js game.js index.html .github
          git commit -m 'Space opportunities and harden grant readiness and range'
          git push origin HEAD:reimplement-23x-safe
