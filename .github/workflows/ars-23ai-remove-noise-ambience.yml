name: ARS 23ai remove noise ambience

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ars-23ai-remove-noise-ambience.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "Ivan Savelyev"
          git config user.email "ivansav@gmail.com"
      - name: Remove synthetic wind bed
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('game.js')
          s=p.read_text()

          s,n=re.subn(
            r"    // SEASONAL ARCTIC AMBIENCE: deliberately subtle; wind, a low tonal bed and sparse seasonal details\.\n    const setupAmbience=c=>\{.*?\};\n",
            "    // SEASONAL ARCTIC AMBIENCE: quiet by default; a low tonal bed and sparse seasonal details.\n    const setupAmbience=c=>{if(ambientPadGain)return;const padFilter=c.createBiquadFilter();padFilter.type='lowpass';padFilter.frequency.value=360;ambientPadGain=c.createGain();ambientPadGain.gain.value=.0001;padFilter.connect(ambientPadGain).connect(c.destination);for(const freq of[82.4,123.6]){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=freq<100?.7:.38;o.connect(g).connect(padFilter);o.start();ambientPadOsc.push(o);}};\n",
            s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'setupAmbience replacement count={n}')

          old="if(ambientWindGain){const wind=paused?0:{autumn:.012,winter:.026,spring:.011,summer:.007}[season];ambientWindGain.gain.setTargetAtTime(wind,ac.currentTime,.8);}"
          if s.count(old)!=1: raise SystemExit(f'wind update count={s.count(old)}')
          s=s.replace(old,'',1)

          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          old='expedition-23ah-drift-audio-local-map'
          if old not in s: raise SystemExit('cache token not found')
          p.write_text(s.replace(old,'expedition-23ai-quiet-ambience'))
          PY
      - name: Validate
        run: |
          node --check game.js
          ! grep -Fq "ambientWindGain.gain.setTargetAtTime" game.js
          ! grep -Fq "windFilter.type='bandpass'" game.js
          grep -Fq "SEASONAL ARCTIC AMBIENCE: quiet by default" game.js
          grep -Fq "expedition-23ai-quiet-ambience" index.html
      - name: Commit
        run: |
          git add game.js index.html
          git commit -m "Replace synthetic wind hiss with quiet ambience"
          git push origin HEAD:main
